name: CC Agent Release Assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing cc-agent-vX.Y.Z tag to build as an Actions artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-agent-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          if ! [[ "$TAG" =~ ^cc-agent-v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$ ]]; then
            echo "Expected an agent tag (cc-agent-vX.Y.Z), not a panel release tag." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Check agent version against tag
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version=$(sed -nE 's/^const Version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' cc-agent/main.go)
          if [[ "$TAG" != "cc-agent-v$version" ]]; then
            echo "Agent tag does not match cc-agent/main.go's Version." >&2
            exit 1
          fi

      - name: Set up Go from cc-agent/go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: cc-agent/go.mod
          cache-dependency-path: cc-agent/go.sum

      - name: Test cc-agent
        working-directory: cc-agent
        run: go test ./...

      - name: Build static Linux binaries
        working-directory: cc-agent
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/cc-agent-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/cc-agent-linux-arm64 .
          cd dist
          sha256sum cc-agent-linux-amd64 cc-agent-linux-arm64 > SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.tag }}
          path: |
            cc-agent/dist/cc-agent-linux-amd64
            cc-agent/dist/cc-agent-linux-arm64
            cc-agent/dist/SHA256SUMS
